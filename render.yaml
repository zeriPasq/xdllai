services:
  - type: web
    name: deepseek-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: worker
    name: telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DEEPSEEK_BASE_URL
        fromService:
          type: web
          name: deepseek-api
          property: host
      - key: TELEGRAM_TOKEN
        sync: false
